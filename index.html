<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄封電競 | XF-CORE MASTER SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffaa00; --bg: #050505; --cyan: #00f2ff; --pink: #ff0050; 
            --border: rgba(255, 170, 0, 0.3); --glass: rgba(255, 255, 255, 0.03);
        }

        /* 核心背景與掃描線 */
        body { 
            background: var(--bg); color: #fff; font-family: 'Orbitron', 'Noto Sans TC', sans-serif; 
            margin: 0; padding: 0; overflow-x: hidden; scroll-behavior: smooth;
        }
        .scanline { 
            width: 100%; height: 100px; z-index: 10; pointer-events: none; position: fixed; top: -100px;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0,242,255,0.05) 50%, rgba(0,0,0,0) 100%);
            animation: scan 6s linear infinite; 
        }
        @keyframes scan { to { top: 100%; } }

        /* 主貨櫃 */
        .container { width: 95%; max-width: 480px; margin: 40px auto; position: relative; z-index: 20; }
        header { text-align: center; margin-bottom: 50px; }
        h1 { 
            font-size: 45px; font-weight: 900; font-style: italic; letter-spacing: 5px; margin: 0;
            background: linear-gradient(180deg, #fff 30%, #666 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
        }
        .tagline { color: var(--cyan); font-size: 10px; letter-spacing: 8px; margin-top: 5px; opacity: 0.8; }

        /* 首頁按鈕列表 */
        .main-nav { display: flex; flex-direction: column; gap: 15px; }
        .nav-btn { 
            text-decoration: none; padding: 20px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.4s;
            display: flex; align-items: center; justify-content: center; position: relative;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
        .nav-btn:hover { 
            background: rgba(0,242,255,0.1); border-color: var(--cyan); 
            box-shadow: -10px 0 20px rgba(0,242,255,0.2); transform: translateX(5px); 
        }
        .btn-tiktok { border-left: 6px solid var(--pink); }
        .btn-players { border-left: 6px solid var(--gold); color: var(--gold); }
        .btn-dc { border-left: 6px solid #5865f2; }

        /* 彈窗系統 */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); 
            z-index: 1000; backdrop-filter: blur(15px); justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content { 
            background: #080808; border: 2px solid var(--gold); width: 100%; max-width: 420px; 
            max-height: 85vh; overflow-y: auto; position: relative; padding: 30px;
            clip-path: polygon(0 0, 90% 0, 100% 10%, 100% 100%, 10% 100%, 0 90%);
            box-shadow: 0 0 50px rgba(255,170,0,0.15);
        }
        .modal-header { border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 25px; }
        .modal-title { color: var(--gold); font-size: 22px; font-weight: 900; font-style: italic; margin: 0; }

        /* 後台管理表單樣式 */
        .admin-box { background: rgba(255,255,255,0.02); border: 1px solid #1a1a1a; padding: 20px; margin-bottom: 30px; border-radius: 4px; }
        .admin-box h3 { color: var(--cyan); font-size: 14px; margin: 0 0 15px 0; border-left: 3px solid var(--cyan); padding-left: 10px; }
        
        label { display: block; font-size: 11px; color: #555; margin-bottom: 5px; text-align: left; }
        input, select, textarea { 
            width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; 
            margin-bottom: 15px; box-sizing: border-box; font-family: inherit; font-size: 14px; outline: none;
        }
        input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,170,0,0.2); }
        
        .action-btn { 
            width: 100%; padding: 16px; background: var(--gold); color: #000; font-weight: 900; 
            border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); transition: 0.3s;
        }
        .action-btn:hover { background: #fff; transform: translateY(-2px); }

        /* 列表管理清單 */
        .item-row { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #000; padding: 12px; margin-bottom: 8px; border: 1px solid #222; 
        }
        .item-info { text-align: left; }
        .item-name { font-size: 14px; font-weight: 900; }
        .item-sub { font-size: 10px; color: #555; }
        .btn-kick { background: var(--pink); color: #fff; border: none; padding: 6px 12px; cursor: pointer; font-size: 10px; font-weight: 900; }

        .close-trigger { color: #444; font-size: 12px; margin-top: 30px; cursor: pointer; transition: 0.3s; }
        .close-trigger:hover { color: var(--pink); }

        .admin-auth-point { margin-top: 80px; opacity: 0.05; cursor: pointer; font-size: 10px; letter-spacing: 5px; }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="container">
    <header>
        <h1>玄封電競</h1>
        <div class="tagline">ELITE GAMING COMMAND CENTER</div>
    </header>

    <div class="main-nav">
        <a id="home-tiktok" href="#" target="_blank" class="nav-btn btn-tiktok">TIKTOK 頻道</a>
        <div class="nav-btn btn-players" onclick="openModal('list-modal')">頂尖打手名錄</div>
        <a id="home-dc" href="#" target="_blank" class="nav-btn btn-dc">DISCORD 語音</a>
        <a id="home-line" href="#" target="_blank" class="nav-btn">LINE 官方客服</a>
        <a id="home-yt" href="#" target="_blank" class="nav-btn">YOUTUBE 賽事</a>
    </div>

    <div class="admin-auth-point" onclick="startAdminAuth()">ACCESS_SYSTEM_CORE_v7.0</div>
</div>

<div id="admin-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <p class="modal-title">XF-CORE 管理終端</p>
        </div>

        <div class="admin-box">
            <h3>首頁媒體連結管理</h3>
            <label>TikTok URL</label>
            <input type="text" id="set-tiktok" placeholder="貼上 TikTok 連結">
            <label>Discord URL</label>
            <input type="text" id="set-dc" placeholder="貼上 Discord 連結">
            <label>Line URL</label>
            <input type="text" id="set-line" placeholder="貼上 Line 連結">
            <label>YouTube URL</label>
            <input type="text" id="set-yt" placeholder="貼上 YouTube 連結">
            <button class="action-btn" onclick="saveSystemSettings()">同步首頁連結</button>
        </div>

        <div class="admin-box">
            <h3>打手成員入庫</h3>
            <input type="text" id="p-name" placeholder="打手代號 (例如：阿峰)">
            <select id="p-game-type">
                <option value="PUBG">PUBG</option>
                <option value="三角洲">三角洲</option>
                <option value="其他">其他</option>
            </select>
            <textarea id="p-desc" rows="3" placeholder="打手詳細介紹與戰績..."></textarea>
            <input type="text" id="p-link" placeholder="打手個人主頁連結">
            <label>上傳圓形頭像照片</label>
            <input type="file" id="p-file" accept="image/*">
            <button class="action-btn" onclick="handlePlayerUpload()">執行資料上傳</button>
        </div>

        <div class="admin-box">
            <h3>成員名單管理</h3>
            <div id="mgmt-list-container">載入資料中...</div>
        </div>

        <div class="close-trigger" onclick="closeModal('admin-modal')">[ 斷開系統連結 ]</div>
    </div>
</div>

<div id="list-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><p class="modal-title">名錄檔案庫</p></div>
        <div id="player-grid-display"></div>
        <div class="close-trigger" onclick="closeModal('list-modal')">[ 返回主選單 ]</div>
    </div>
</div>

<script>
    // 初始化 Supabase
    const SB_URL = "https://chjuzpbocdkdiyuuziye.supabase.co"; 
    const SB_KEY = "sb_publishable_kFflCNsyHLFgc8Ee_iWAEw_q5AFG3YC";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    let currentPlayers = [];

    // --- 系統初始化 ---
    async function initSystem() {
        await loadSettings();
        await loadPlayers();
    }

    // 1. 讀取並應用首頁連結
    async function loadSettings() {
        const { data } = await _sb.from('settings').select('*');
        if (data) {
            data.forEach(s => {
                const linkEl = document.getElementById(`home-${s.id}`);
                const inputEl = document.getElementById(`set-${s.id}`);
                if (linkEl) linkEl.href = s.url;
                if (inputEl) inputEl.value = s.url;
            });
        }
    }

    // 2. 儲存首頁連結
    async function saveSystemSettings() {
        const ids = ['tiktok', 'dc', 'line', 'yt'];
        for (const id of ids) {
            const url = document.getElementById(`set-${id}`).value;
            await _sb.from('settings').upsert({ id, url });
        }
        alert("首頁媒體連結已成功更新！");
        location.reload();
    }

    // 3. 處理打手資料上傳
    async function handlePlayerUpload() {
        const name = document.getElementById('p-name').value;
        const game = document.getElementById('p-game-type').value;
        const desc = document.getElementById('p-desc').value;
        const link = document.getElementById('p-link').value;
        const file = document.getElementById('p-file').files[0];

        if (!name || !link) return alert("請填寫代號與連結！");

        let finalAvatarUrl = "";
        if (file) {
            const fileName = `avatar_${Date.now()}.png`;
            const { data, error } = await _sb.storage.from('avatars').upload(fileName, file);
            if (data) {
                const { data: pUrl } = _sb.storage.from('avatars').getPublicUrl(fileName);
                finalAvatarUrl = pUrl.publicUrl;
            }
        }

        const { error } = await _sb.from('players').insert([{
            name: name,
            game_type: game,
            description: desc,
            url: link,
            avatar_url: finalAvatarUrl
        }]);

        if (!error) {
            alert("打手資料已成功入庫！");
            location.reload();
        } else {
            alert("上傳失敗：" + error.message);
        }
    }

    // 4. 管理名單 (踢出功能)
    async function loadPlayers() {
        const { data } = await _sb.from('players').select('*').order('id', { ascending: false });
        currentPlayers = data || [];
        
        const mgmtDiv = document.getElementById('mgmt-list-container');
        mgmtDiv.innerHTML = currentPlayers.map(p => `
            <div class="item-row">
                <div class="item-info">
                    <div class="item-name">${p.name}</div>
                    <div class="item-sub">${p.game_type}</div>
                </div>
                <button class="btn-kick" onclick="kickPlayer(${p.id})">踢出成員</button>
            </div>
        `).join('');
    }

    async function kickPlayer(id) {
        if (confirm("確定要將此成員從名單中剔除？")) {
            await _sb.from('players').delete().eq('id', id);
            alert("成員已剔除。");
            location.reload();
        }
    }

    // --- 權限與彈窗控制 ---
    function startAdminAuth() {
        const pass = prompt("請輸入系統核心密碼："); //
        if (pass === "@8888") {
            openModal('admin-modal');
        } else {
            alert("授權失敗：存取遭拒。");
        }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    initSystem();
</script>
</body>
</html>

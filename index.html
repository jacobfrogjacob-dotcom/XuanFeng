<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄封電競 | XF-CORE MASTER SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffaa00; --bg: #050505; --cyan: #00f2ff; --pink: #ff0050; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Orbitron', 'Noto Sans TC', sans-serif; margin: 0; padding: 0; text-align: center; overflow-x: hidden; }
        
        /* 視覺背景 */
        .scanline { width: 100%; height: 100px; z-index: 10; pointer-events: none; position: fixed; top: -100px; background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0,242,255,0.05) 50%, rgba(0,0,0,0) 100%); animation: scan 6s linear infinite; }
        @keyframes scan { to { top: 100%; } }

        .container { width: 95%; max-width: 450px; margin: 40px auto; position: relative; z-index: 20; }
        h1 { font-size: 45px; font-weight: 900; font-style: italic; background: linear-gradient(180deg, #fff 30%, #777 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .sub-title { color: var(--cyan); font-size: 10px; letter-spacing: 5px; margin-bottom: 40px; }

        /* 首頁按鈕列表 */
        .main-menu { display: flex; flex-direction: column; gap: 12px; }
        .nav-btn { text-decoration: none; padding: 18px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 17px; font-weight: 900; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: rgba(0,242,255,0.1); border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,242,255,0.2); transform: scale(1.02); }
        .btn-tiktok { border-left: 5px solid var(--pink); }
        .btn-players { border-left: 5px solid var(--gold); color: var(--gold); }
        .btn-discord { border-left: 5px solid #5865f2; }

        /* 彈窗樣式 */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; backdrop-filter: blur(15px); justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #0a0a0a; padding: 25px; border: 2px solid var(--gold); width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; position: relative; clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%); box-shadow: 0 0 40px rgba(255,170,0,0.2); }
        
        /* 遊戲分類功能 */
        .game-tabs { display: flex; gap: 10px; margin: 20px 0; border-bottom: 1px solid #222; padding-bottom: 15px; overflow-x: auto; }
        .tab { padding: 8px 16px; border: 1px solid #333; cursor: pointer; font-size: 13px; white-space: nowrap; transition: 0.3s; color: #666; }
        .tab.active { background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: 900; box-shadow: 0 0 10px var(--cyan); }

        /* 打手卡片 */
        #player-list { display: flex; flex-direction: column; gap: 12px; }
        .p-card { background: rgba(255,255,255,0.02); border: 1px solid #1a1a1a; padding: 12px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-left: 4px solid var(--gold); transition: 0.2s; }
        .p-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--cyan); object-fit: cover; }

        /* 管理員介面 */
        .admin-section { text-align: left; background: rgba(255,255,255,0.01); border: 1px solid #222; padding: 15px; margin-bottom: 20px; }
        .admin-section h3 { color: var(--gold); font-size: 14px; margin-top: 0; }
        input, select, textarea { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin-bottom: 12px; box-sizing: border-box; font-family: inherit; }
        .btn-exe { width: 100%; padding: 15px; background: var(--gold); color: #000; font-weight: 900; border: none; cursor: pointer; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); transition: 0.3s; }

        .mgmt-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #000; border-bottom: 1px solid #111; font-size: 13px; }
        .btn-edit { background: #444; color: #fff; border: none; padding: 5px 10px; cursor: pointer; font-size: 11px; margin-right: 5px; }
        .btn-kick { background: var(--pink); color: #fff; border: none; padding: 5px 10px; cursor: pointer; font-size: 11px; }

        .close-txt { color: #555; font-size: 12px; margin-top: 20px; cursor: pointer; display: inline-block; }
        .admin-trigger { margin-top: 80px; opacity: 0.05; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="container">
    <h1>玄封電競</h1>
    <div class="sub-title">XUAN FENG CORE v9.0</div>

    <div class="main-menu">
        <a href="https://www.tiktok.com/@xuenfeng_xu666_?_r=1" target="_blank" class="nav-btn btn-tiktok">TIKTOK 頻道</a>
        <div class="nav-btn btn-players" onclick="openPlayerList()">頂尖打手名錄</div>
        <a href="https://discord.gg/vCcFpKuzR" target="_blank" class="nav-btn btn-discord">DISCORD 語音</a>
        <a href="https://lin.ee/rTNT2B6" target="_blank" class="nav-btn">LINE 官方客服</a>
        <a href="https://youtube.com/@xfg-mtd?si=WVPbE8pA1G5B-Unt" target="_blank" class="nav-btn">YOUTUBE 賽事</a>
    </div>

    <div class="admin-trigger" onclick="adminAuth()">SYSTEM_ROOT_LOGIN</div>
</div>

<div id="list-modal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--gold); font-style:italic;">ELITE PLAYERS</h2>
        <div class="game-tabs" id="game-tabs-box">
            <div class="tab active" onclick="setFilter('PUBG')">PUBG</div>
            <div class="tab" onclick="setFilter('三角洲')">三角洲</div>
            <div class="tab" onclick="setFilter('其他')">其他</div>
        </div>
        <div id="player-list">載入資料庫中...</div>
        <div class="close-txt" onclick="closeModal('list-modal')">[ 返回主選單 ]</div>
    </div>
</div>

<div id="profile-modal" class="modal">
    <div class="modal-content" id="profile-body"></div>
</div>

<div id="admin-modal" class="modal">
    <div class="modal-content">
        <h2 id="admin-title" style="color:var(--gold)">後台管理終端</h2>
        
        <div class="admin-section">
            <h3 id="form-mode-title">新增打手成員</h3>
            <input type="text" id="adm-name" placeholder="打手代號">
            <select id="adm-game">
                <option value="PUBG">PUBG</option>
                <option value="三角洲">三角洲</option>
                <option value="其他">其他</option>
            </select>
            <textarea id="adm-desc" rows="2" placeholder="成員簡介/戰績..."></textarea>
            <input type="text" id="adm-url" placeholder="個人主頁連結">
            <input type="file" id="adm-file" accept="image/*">
            <button id="submit-btn" class="btn-exe" onclick="uploadData()">執行：資料入庫</button>
            <button id="cancel-edit" style="display:none; margin-top:10px; background:transparent; color:#555; border:none; cursor:pointer;" onclick="resetForm()">取消編輯</button>
        </div>

        <div class="admin-section">
            <h3>成員名單修正/踢出</h3>
            <div id="mgmt-players-box"></div>
        </div>

        <div class="close-txt" onclick="closeModal('admin-modal')">[ 斷開核心連結 ]</div>
    </div>
</div>

<script>
    const SB_URL = "https://chjuzpbocdkdiyuuziye.supabase.co"; 
    const SB_KEY = "sb_publishable_kFflCNsyHLFgc8Ee_iWAEw_q5AFG3YC";
    const _sb = supabase.createClient(SB_URL, SB_KEY);

    let allPlayers = [];
    let filterGame = 'PUBG';
    let editId = null;

    async function init() {
        const { data } = await _sb.from('players').select('*').order('id', { ascending: false });
        allPlayers = data || [];
        renderList();
    }

    function openPlayerList() { openModal('list-modal'); init(); }

    function setFilter(game) {
        filterGame = game;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.innerText === game));
        renderList();
    }

    function renderList() {
        const box = document.getElementById('player-list');
        const filtered = allPlayers.filter(p => p.game_type === filterGame);
        box.innerHTML = filtered.length ? filtered.map(p => `
            <div class="p-card" onclick="showProfile(${p.id})">
                <img src="${p.avatar_url || 'https://via.placeholder.com/100'}" class="p-avatar">
                <div style="text-align:left">
                    <div style="font-weight:900; font-size:18px;">${p.name}</div>
                    <div style="color:var(--cyan); font-size:10px;">ELITE STATUS</div>
                </div>
            </div>
        `).join('') : `<div style="color:#333; padding:40px;">目前尚無成員資料</div>`;
    }

    function showProfile(id) {
        const p = allPlayers.find(x => x.id === id);
        const body = document.getElementById('profile-body');
        body.innerHTML = `
            <img src="${p.avatar_url || 'https://via.placeholder.com/100'}" class="p-avatar" style="width:100px; height:100px;">
            <h2 style="color:var(--gold); margin:15px 0;">${p.name}</h2>
            <p style="color:var(--cyan); font-size:12px;">分類: ${p.game_type}</p>
            <p style="color:#888; font-size:14px; text-align:left; line-height:1.6; margin:20px 0;">${p.description || '暫無詳細介紹。'}</p>
            <a href="${p.url}" target="_blank" class="btn-exe" style="display:block; text-decoration:none;">前往主頁連結</a>
            <div class="close-txt" onclick="closeModal('profile-modal')">[ 返回名錄 ]</div>
        `;
        openModal('profile-modal');
    }

    // 管理員編輯功能
    function startEdit(id) {
        const p = allPlayers.find(x => x.id === id);
        editId = id;
        document.getElementById('adm-name').value = p.name;
        document.getElementById('adm-game').value = p.game_type;
        document.getElementById('adm-desc').value = p.description;
        document.getElementById('adm-url').value = p.url;
        document.getElementById('form-mode-title').innerText = "修正成員資料";
        document.getElementById('submit-btn').innerText = "確認更新資料";
        document.getElementById('submit-btn').style.background = "var(--cyan)";
        document.getElementById('cancel-edit').style.display = "inline-block";
        document.getElementById('admin-modal').scrollTop = 0;
    }

    function resetForm() {
        editId = null;
        document.getElementById('adm-name').value = "";
        document.getElementById('adm-desc').value = "";
        document.getElementById('adm-url').value = "";
        document.getElementById('form-mode-title').innerText = "新增打手成員";
        document.getElementById('submit-btn').innerText = "執行：資料入庫";
        document.getElementById('submit-btn').style.background = "var(--gold)";
        document.getElementById('cancel-edit').style.display = "none";
    }

    async function uploadData() {
        const name = document.getElementById('adm-name').value;
        const game = document.getElementById('adm-game').value;
        const desc = document.getElementById('adm-desc').value;
        const url = document.getElementById('adm-url').value;
        const file = document.getElementById('adm-file').files[0];

        if(!name || !url) return alert("代號與連結不可為空");

        let avUrl = "";
        if(file) {
            const fName = `${Date.now()}.png`;
            const { data } = await _sb.storage.from('avatars').upload(fName, file);
            if(data) {
                const { data: pUrl } = _sb.storage.from('avatars').getPublicUrl(fName);
                avUrl = pUrl.publicUrl;
            }
        }

        if(editId) {
            const upData = { name, game_type: game, description: desc, url };
            if(avUrl) upData.avatar_url = avUrl;
            await _sb.from('players').update(upData).eq('id', editId);
            alert("資料已修正完成");
        } else {
            await _sb.from('players').insert([{ name, game_type: game, description: desc, url, avatar_url: avUrl }]);
            alert("新成員已成功入庫");
        }
        location.reload();
    }

    async function kick(id) {
        if(confirm("確定剔除此成員？")) {
            await _sb.from('players').delete().eq('id', id);
            location.reload();
        }
    }

    function adminAuth() {
        if(prompt("請輸入玄封核心密碼：") === "@8888") {
            openModal('admin-modal');
            const box = document.getElementById('mgmt-players-box');
            box.innerHTML = allPlayers.map(p => `
                <div class="mgmt-item">
                    <span>${p.name} (${p.game_type})</span>
                    <div>
                        <button class="btn-edit" onclick="startEdit(${p.id})">編輯</button>
                        <button class="btn-kick" onclick="kick(${p.id})">踢出</button>
                    </div>
                </div>
            `).join('');
        }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄鋒電競 | 雲端指令系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
    <style>
        /* 基礎樣式 */
        :root { --gold: #ffaa00; --bg: #050505; --cyan: #00f2ff; --pink: #ff0050; }
        body { background: var(--bg); color: #fff; font-family: 'Orbitron', 'Noto Sans TC', sans-serif; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        
        /* 掃描線特效 */
        body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%), linear-gradient(90deg, rgba(255,0,0,0.02), rgba(0,255,0,0.01), rgba(0,0,255,0.02)); background-size: 100% 3px, 3px 100%; z-index: 10; pointer-events: none; }

        .container { width: 90%; max-width: 400px; margin: 0 auto; z-index: 20; position: relative; }
        
        /* 標題樣式 */
        h1 { font-size: 42px; margin: 20px 0 5px 0; font-weight: 900; font-style: italic; background: linear-gradient(180deg, #fff 40%, #777 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.4)); }
        .sub-title { color: var(--cyan); font-size: 12px; letter-spacing: 2px; margin-bottom: 40px; font-weight: bold; }

        /* 按鈕列表樣式 */
        .btn-list { display: flex; flex-direction: column; gap: 15px; }
        .btn { text-decoration: none; padding: 18px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; font-size: 18px; font-weight: 900; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn:hover { transform: scale(1.05) skewX(-2deg); background: rgba(255, 255, 255, 0.1); border-color: var(--cyan); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }

        /* 各別按鈕邊框顏色 */
        .btn-tiktok { border-left: 6px solid var(--pink); }
        .btn-players { border-left: 6px solid var(--gold); color: var(--gold); }
        .btn-line { border-left: 6px solid #00b900; }
        .btn-youtube { border-left: 6px solid #ff0000; }
        .btn-discord { border-left: 6px solid #5865f2; }

        /* 管理彈窗 CSS 優化 */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px); }
        .modal-content { background: #0a0a0a; padding: 30px; border: 2px solid var(--gold); width: 85%; max-width: 380px; position: relative; box-shadow: 0 0 30px rgba(255, 170, 0, 0.2); clip-path: polygon(0 0, 90% 0, 100% 10%, 100% 100%, 10% 100%, 0 90%); }
        .modal-content h2 { color: var(--gold); margin: 0 0 20px 0; font-style: italic; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        /* 管理面板輸入框 */
        .admin-panel { background: rgba(255, 170, 0, 0.05); padding: 15px; margin-bottom: 20px; border: 1px dashed var(--gold); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; box-sizing: border-box; outline: none; font-family: inherit; }
        input:focus { border-color: var(--cyan); }
        .add-btn { width: 100%; padding: 12px; background: var(--gold); color: #000; font-weight: 900; border: none; cursor: pointer; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); }

        /* 打手列表樣式 */
        #player-box { text-align: left; max-height: 250px; overflow-y: auto; margin: 15px 0; padding-right: 10px; }
        #player-box::-webkit-scrollbar { width: 5px; }
        #player-box::-webkit-scrollbar-thumb { background: var(--gold); }
        .player-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; align-items: center; transition: 0.2s; }
        .player-item:hover { background: rgba(255,255,255,0.02); }
        .player-item a { color: #fff; text-decoration: none; font-weight: bold; font-size: 16px; }
        .del-btn { background: #ff4444; color: white; border: none; padding: 5px 12px; cursor: pointer; font-size: 12px; font-weight: bold; clip-path: skewX(-10deg); }

        .close-text { color: #ff4444; cursor: pointer; font-weight: bold; margin-top: 20px; display: inline-block; letter-spacing: 2px; }
        .admin-trigger { margin-top: 60px; color: #111; cursor: pointer; font-size: 10px; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>玄鋒電競</h1>
        <div class="sub-title">XUAN FENG COMMAND CENTER</div>

        <div class="btn-list">
            <a href="https://www.tiktok.com/@xuenfeng_xu666_?_r=1" target="_blank" class="btn btn-tiktok">TIKTOK 頻道</a>
            <div class="btn btn-players" onclick="openModal()">頂尖打手名錄</div>
            <a href="https://lin.ee/rTNT2B6" target="_blank" class="btn btn-line">LINE 官方客服</a>
            <a href="https://youtube.com/@xfg-mtd" target="_blank" class="btn btn-youtube">YOUTUBE 賽事</a>
            <a href="https://discord.gg/vCcFpKuzR" target="_blank" class="btn btn-discord">DISCORD 語音</a>
        </div>

        <div class="admin-trigger" onclick="adminLogin()">DATABASE_ACCESS_SYSTEM</div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2>PLAYER DATA</h2>
            
            <div id="admin-panel" style="display: none;" class="admin-panel">
                <input type="text" id="p-name" placeholder="打手代號">
                <input type="text" id="p-url" placeholder="TikTok 連結">
                <button class="add-btn" onclick="addPlayer()">執行指令：發布刊登</button>
            </div>

            <div id="player-box">資料讀取中...</div>
            
            <div class="close-text" onclick="closeModal()">[ 關閉系統 ]</div>
        </div>
    </div>

    <script>
        // 你提供的專案連線資訊
        const SB_URL = "https://chjuzpbocdkdiyuuziye.supabase.co"; 
        const SB_KEY = "sb_publishable_kFflCNsyHLFgc8Ee_iWAEw_q5AFG3YC";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let isAdmin = false;

        async function refreshList() {
            const box = document.getElementById('player-box');
            // 從 players 資料表讀取數據
            const { data, error } = await _supabase.from('players').select('*').order('id', { ascending: false });
            
            if (error) {
                box.innerHTML = "<span style='color:red'>連線失敗，請檢查 RLS</span>";
                return;
            }

            box.innerHTML = data.length ? data.map(p => `
                <div class="player-item">
                    <a href="${p.url}" target="_blank">${p.name}</a>
                    ${isAdmin ? `<button class="del-btn" onclick="delPlayer(${p.id})">撤下</button>` : ''}
                </div>
            `).join('') : "<div style='color:#444'>目前尚無存檔資料</div>";
        }

        async function addPlayer() {
            const name = document.getElementById('p-name').value;
            const url = document.getElementById('p-url').value;
            if(!name || !url) return alert("請完整輸入資料");

            const { error } = await _supabase.from('players').insert([{ name, url }]);
            if (error) {
                alert("指令執行失敗，請確認 SQL 中已執行 DISABLE RLS");
            } else {
                document.getElementById('p-name').value = '';
                document.getElementById('p-url').value = '';
                refreshList();
            }
        }

        async function delPlayer(id) {
            if(confirm("確定刪除此打手指令？")) {
                await _supabase.from('players').delete().eq('id', id);
                refreshList();
            }
        }

        function adminLogin() {
            if(prompt("請輸入系統授權碼：") === "@8888") {
                isAdmin = true;
                document.getElementById('admin-panel').style.display = 'block';
                openModal();
            }
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; refreshList(); }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄封電競 | XF-CORE MASTER SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffaa00; --bg: #050505; --cyan: #00f2ff; --pink: #ff0050; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Orbitron', 'Noto Sans TC', sans-serif; margin: 0; padding: 0; text-align: center; overflow-x: hidden; }
        
        .scanline { width: 100%; height: 100px; z-index: 10; pointer-events: none; position: fixed; top: -100px; background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0,242,255,0.05) 50%, rgba(0,0,0,0) 100%); animation: scan 6s linear infinite; }
        @keyframes scan { to { top: 100%; } }

        .container { width: 95%; max-width: 450px; margin: 40px auto; position: relative; z-index: 20; }
        h1 { font-size: 45px; font-weight: 900; font-style: italic; background: linear-gradient(180deg, #fff 30%, #777 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        .sub-title { color: var(--cyan); font-size: 10px; letter-spacing: 5px; margin-bottom: 40px; }

        /* 按鈕樣式 */
        .main-menu { display: flex; flex-direction: column; gap: 12px; }
        .nav-btn { text-decoration: none; padding: 18px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 17px; font-weight: 900; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: rgba(0,242,255,0.1); border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,242,255,0.2); transform: scale(1.02); }
        .btn-tiktok { border-left: 5px solid var(--pink); }
        .btn-players { border-left: 5px solid var(--gold); color: var(--gold); }
        .btn-discord { border-left: 5px solid #5865f2; }

        /* 彈窗 UI */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; backdrop-filter: blur(15px); justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #0a0a0a; padding: 25px; border: 2px solid var(--gold); width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; position: relative; clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%); }
        
        .game-tabs { display: flex; gap: 10px; margin: 20px 0; border-bottom: 1px solid #222; padding-bottom: 15px; overflow-x: auto; }
        .tab { padding: 8px 16px; border: 1px solid #333; cursor: pointer; font-size: 13px; white-space: nowrap; transition: 0.3s; color: #666; }
        .tab.active { background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: 900; }

        .p-card { background: rgba(255,255,255,0.02); border: 1px solid #1a1a1a; padding: 12px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-left: 4px solid var(--gold); margin-bottom: 10px; }
        .p-avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--cyan); object-fit: cover; }

        /* 管理員表單 */
        .admin-section { text-align: left; background: rgba(255,255,255,0.01); border: 1px solid #222; padding: 15px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin-bottom: 12px; box-sizing: border-box; font-family: inherit; }
        .btn-exe { width: 100%; padding: 15px; background: var(--gold); color: #000; font-weight: 900; border: none; cursor: pointer; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); }

        .mgmt-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #000; border-bottom: 1px solid #111; font-size: 13px; }
        .btn-edit { background: #444; color: #fff; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-kick { background: var(--pink); color: #fff; border: none; padding: 5px 10px; cursor: pointer; }

        .close-txt { color: #555; font-size: 12px; margin-top: 20px; cursor: pointer; display: inline-block; }
        .admin-trigger { margin-top: 80px; opacity: 0.05; cursor: pointer; }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="container">
    <h1>玄封電競</h1>
    <div class="sub-title">XUAN FENG ELITE v9.2</div>

    <div class="main-menu">
        <a href="https://www.tiktok.com/@xuenfeng_xu666_?_r=1" target="_blank" class="nav-btn btn-tiktok">TIKTOK 頻道</a>
        <div class="nav-btn btn-players" onclick="openPlayerList()">頂尖打手名錄</div>
        <a href="https://discord.gg/vCcFpKuzR" target="_blank" class="nav-btn btn-discord">DISCORD 語音</a>
        <a href="https://lin.ee/rTNT2B6" target="_blank" class="nav-btn">LINE 官方客服</a>
        <a href="https://youtube.com/@xfg-mtd?si=WVPbE8pA1G5B-Unt" target="_blank" class="nav-btn">YOUTUBE 賽事</a>
    </div>

    <div class="admin-trigger" onclick="adminAuth()">SYSTEM_ACCESS</div>
</div>

<div id="list-modal" class="modal"><div class="modal-content">
    <h2 style="color:var(--gold)">打手名錄檔案庫</h2>
    <div class="game-tabs"><div class="tab active" onclick="setFilter('PUBG')">PUBG</div><div class="tab" onclick="setFilter('三角洲')">三角洲</div><div class="tab" onclick="setFilter('其他')">其他</div></div>
    <div id="player-list">載入中...</div>
    <div class="close-txt" onclick="closeModal('list-modal')">[ 關閉 ]</div>
</div></div>

<div id="profile-modal" class="modal"><div class="modal-content" id="profile-body"></div></div>

<div id="admin-modal" class="modal"><div class="modal-content">
    <h2 style="color:var(--gold)">玄封核心管理後台</h2>
    <div class="admin-section">
        <h3 id="form-title">新增打手</h3>
        <input type="text" id="adm-name" placeholder="代號">
        <select id="adm-game"><option value="PUBG">PUBG</option><option value="三角洲">三角洲</option><option value="其他">其他</option></select>
        <textarea id="adm-desc" placeholder="簡介"></textarea>
        <input type="text" id="adm-url" placeholder="主頁連結">
        <input type="file" id="adm-file">
        <button id="submit-btn" class="btn-exe" onclick="uploadData()">執行入庫</button>
        <button id="cancel-btn" style="display:none; background:none; color:#555; border:none; margin-top:10px;" onclick="resetForm()">取消編輯</button>
    </div>
    <div class="admin-section"><h3>名單管理</h3><div id="mgmt-box"></div></div>
    <div class="close-txt" onclick="closeModal('admin-modal')">[ 斷開連結 ]</div>
</div></div>

<script>
    const SB_URL = "https://chjuzpbocdkdiyuuziye.supabase.co"; 
    const SB_KEY = "sb_publishable_kFflCNsyHLFgc8Ee_iWAEw_q5AFG3YC";
    const _sb = supabase.createClient(SB_URL, SB_KEY);
    let allPlayers = [], filterGame = 'PUBG', editId = null;

    async function init() {
        const { data } = await _sb.from('players').select('*').order('id', { ascending: false });
        allPlayers = data || [];
        renderList();
        if (sessionStorage.getItem('xf_admin') === 'true') { renderMgmt(); }
    }

    function openPlayerList() { openModal('list-modal'); init(); }
    function setFilter(g) { filterGame = g; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.innerText === g)); renderList(); }
    
    function renderList() {
        const box = document.getElementById('player-list');
        const filtered = allPlayers.filter(p => p.game_type === filterGame);
        box.innerHTML = filtered.map(p => `
            <div class="p-card" onclick="showProfile(${p.id})">
                <img src="${p.avatar_url || 'https://via.placeholder.com/100'}" class="p-avatar">
                <div style="text-align:left"><div style="font-weight:900;">${p.name}</div><div style="color:var(--cyan); font-size:10px;">ELITE</div></div>
            </div>
        `).join('') || "目前無資料";
    }

    function showProfile(id) {
        const p = allPlayers.find(x => x.id === id);
        document.getElementById('profile-body').innerHTML = `
            <img src="${p.avatar_url || 'https://via.placeholder.com/100'}" class="p-avatar" style="width:80px; height:80px;">
            <h2 style="color:var(--gold)">${p.name}</h2>
            <p style="font-size:14px; text-align:left; color:#888;">${p.description || '暫無內容'}</p>
            <a href="${p.url}" target="_blank" class="btn-exe" style="display:block; text-decoration:none;">前往主頁</a>
            <div class="close-txt" onclick="closeModal('profile-modal')">[ 返回 ]</div>
        `;
        openModal('profile-modal');
    }

    function adminAuth() {
        if(prompt("核心密碼：") === "@8888") {
            sessionStorage.setItem('xf_admin', 'true');
            openModal('admin-modal');
            renderMgmt();
        }
    }

    async function uploadData() {
        const name = document.getElementById('adm-name').value;
        const game = document.getElementById('adm-game').value;
        const desc = document.getElementById('adm-desc').value;
        const url = document.getElementById('adm-url').value;
        const file = document.getElementById('adm-file').files[0];

        let avUrl = "";
        if(file) {
            const fName = `v_${Date.now()}.png`;
            const { data } = await _sb.storage.from('avatars').upload(fName, file);
            if(data) { avUrl = _sb.storage.from('avatars').getPublicUrl(fName).data.publicUrl; }
        }

        if(editId) {
            const up = { name, game_type: game, description: desc, url };
            if(avUrl) up.avatar_url = avUrl; // 有新圖才換，沒新圖不改
            await _sb.from('players').update(up).eq('id', editId);
        } else {
            await _sb.from('players').insert([{ name, game_type: game, description: desc, url, avatar_url: avUrl }]);
        }
        location.reload();
    }

    function startEdit(id) {
        const p = allPlayers.find(x => x.id === id);
        editId = id;
        document.getElementById('adm-name').value = p.name;
        document.getElementById('adm-game').value = p.game_type;
        document.getElementById('adm-desc').value = p.description;
        document.getElementById('adm-url').value = p.url;
        document.getElementById('form-title').innerText = "修正資料 (保留原圖)";
        document.getElementById('submit-btn').innerText = "確認更新";
        document.getElementById('submit-btn').style.background = "var(--cyan)";
        document.getElementById('cancel-btn').style.display = "block";
        document.getElementById('admin-modal').scrollTop = 0;
    }

    function resetForm() { editId = null; location.reload(); }

    function renderMgmt() {
        const box = document.getElementById('mgmt-box');
        if(!box) return;
        box.innerHTML = allPlayers.map(p => `
            <div class="mgmt-item">
                <span>${p.name}</span>
                <div><button class="btn-edit" onclick="startEdit(${p.id})">改</button>
                <button class="btn-kick" onclick="kick(${p.id})">刪</button></div>
            </div>
        `).join('');
    }

    async function kick(id) { if(confirm("剔除？")) { await _sb.from('players').delete().eq('id', id); location.reload(); } }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    init();
    // 檢查是否已登入
    if(sessionStorage.getItem('xf_admin') === 'true') { openModal('admin-modal'); }
</script>
</body>
</html>
